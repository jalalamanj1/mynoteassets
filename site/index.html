<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mynote Assets — Admin</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="login-view" class="view">
    <form id="login-form" class="card">
      <div class="logo-badge">◆</div>
      <h1>Mynote Assets</h1>
      <p class="sub">Admin portal — sign in to browse and upload</p>
      <input id="username" placeholder="Username" autocomplete="username" required>
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
      <button type="submit" id="login-btn">Log in</button>
      <p id="login-error" class="msg error hidden"></p>
    </form>
  </div>

  <div id="app-view" class="view hidden">
    <header class="topbar">
      <div class="brand"><span class="logo-badge small">◆</span> Mynote Assets</div>
      <div class="user">
        <span id="user-name"></span>
        <button class="ghost" id="logout">Log out</button>
      </div>
    </header>

    <main>
      <section class="panel" id="upload-panel">
        <div class="panel-head">
          <h2>Upload</h2>
          <span class="hint">Saved permanently to the repo under <code>diagrams/&lt;Subject&gt;/</code></span>
        </div>
        <form id="upload-form" class="upload-form">
          <div class="row">
            <label>
              <span>Subject</span>
              <select id="subject" required></select>
            </label>
            <label>
              <span>Category (optional)</span>
              <input id="category" placeholder="e.g. Cell, Skeletal">
            </label>
          </div>
          <div class="row">
            <label class="file-label">
              <span>File</span>
              <input id="file" type="file" required>
            </label>
            <label class="submit-label">
              <span>&nbsp;</span>
              <button type="submit" id="upload-btn">Upload</button>
            </label>
          </div>
          <p id="upload-status" class="msg hidden"></p>
        </form>
      </section>

      <section class="panel" id="browse-panel">
        <div class="panel-head">
          <h2>Content</h2>
          <span class="hint">Latest from the repo (live)</span>
        </div>
        <nav id="subject-tabs" class="tabs"></nav>
        <p id="browse-status" class="msg hidden"></p>
        <div id="file-grid" class="grid"></div>
      </section>
    </main>
  </div>

  <script src="js/app.js?v=2"></script>
</body>
</html>
